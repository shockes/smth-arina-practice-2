<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${editing} ? 'Редактирование сотрудника' : 'Добавление сотрудника'">Форма</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 24px; background: #f5f6f8; color: #222; }
        h1 { font-size: 22px; margin: 0 0 16px; }
        .card { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.08); max-width: 560px; }
        .field { margin-bottom: 14px; }
        label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 4px; }
        input[type=text], input[type=email], input[type=number] {
            width: 100%; box-sizing: border-box; padding: 8px; border: 1px solid #c9ced6;
            border-radius: 4px; font-size: 14px;
        }
        input.field-error { border-color: #e04a4a; background: #fffafa; }
        .error { color: #b02a2a; font-size: 12px; margin-top: 4px; }
        .btn { display: inline-block; padding: 8px 16px; border: none; border-radius: 4px;
               font-size: 14px; text-decoration: none; cursor: pointer; background: #2f6feb; color: #fff; }
        .btn-save { background: #22a06b; }
        .btn-back { background: #8a93a2; }
        .checkbox-row { display: flex; align-items: center; gap: 8px; }
        .checkbox-row input { width: auto; }
    </style>
</head>
<body>
<h1 th:text="${editing} ? 'Редактирование сотрудника' : 'Добавление сотрудника'">Форма</h1>

<div class="card">
    <form th:object="${employee}"
          th:action="${editing} ? @{/employees/edit/{id}(id=${employee.id})} : @{/employees/add}"
          method="post" novalidate>

        <input type="hidden" th:field="*{id}">

        <div class="field">
            <label for="fullName">ФИО</label>
            <input type="text" id="fullName" th:field="*{fullName}" placeholder="Иванов Иван Иванович"
                   th:classappend="${#fields.hasErrors('fullName')} ? 'field-error'">
            <div class="error" th:each="err : ${#fields.errors('fullName')}" th:text="${err}"></div>
        </div>

        <div class="field">
            <label for="email">Email</label>
            <input type="text" id="email" th:field="*{email}" placeholder="ivanov@mail.ru"
                   th:classappend="${#fields.hasErrors('email')} ? 'field-error'">
            <div class="error" th:each="err : ${#fields.errors('email')}" th:text="${err}"></div>
        </div>

        <div class="field">
            <label for="phone">Телефон</label>
            <input type="text" id="phone" th:field="*{phone}" placeholder="+79001234567"
                   th:classappend="${#fields.hasErrors('phone')} ? 'field-error'">
            <div class="error" th:each="err : ${#fields.errors('phone')}" th:text="${err}"></div>
        </div>

        <div class="field">
            <label for="position">Должность</label>
            <input type="text" id="position" th:field="*{position}" placeholder="Программист"
                   th:classappend="${#fields.hasErrors('position')} ? 'field-error'">
            <div class="error" th:each="err : ${#fields.errors('position')}" th:text="${err}"></div>
        </div>

        <div class="field">
            <label for="salary">Зарплата, ₽</label>
            <input type="number" step="0.01" min="0" id="salary" th:field="*{salary}" placeholder="100000.00"
                   th:classappend="${#fields.hasErrors('salary')} ? 'field-error'">
            <div class="error" th:each="err : ${#fields.errors('salary')}" th:text="${err}"></div>
        </div>

        <div class="field checkbox-row">
            <input type="checkbox" id="active" th:field="*{active}">
            <label for="active" style="margin:0;">Сотрудник активен</label>
        </div>

        <div class="field">
            <button type="submit" class="btn btn-save"
                    th:text="${editing} ? 'Сохранить изменения' : 'Добавить'">Сохранить</button>
            <a class="btn btn-back" th:href="@{/employees}">Отмена</a>
        </div>
    </form>
</div>
</body>
</html>
